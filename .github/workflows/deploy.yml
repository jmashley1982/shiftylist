# Every push to main deploys the staff app to Cloudflare.
#
# Cloudflare's own "Workers Builds" GitHub connection stopped firing —
# pushes landed on main and nothing shipped. This does the same job from
# GitHub's side, where we can see the logs when it goes wrong.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN, made from Cloudflare's
# "Edit Cloudflare Workers" token template. Repository secret, not an
# environment secret — an environment is one more thing to delete by accident,
# and it was.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # Lets a deploy be re-run by hand from the Actions tab without a new commit.
  workflow_dispatch:

# A newer push wins: no point deploying an older commit over a newer one.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck first — a broken push should fail here, not on the phone of
      # whoever is working the close shift.
      - run: pnpm run typecheck

      - run: pnpm --filter @workspace/shiftlist run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
